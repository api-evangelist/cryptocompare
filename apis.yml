description: >-
  CryptoCompare (now CoinDesk Data / CCData, acquired by CoinDesk in late 2024) is a long-standing crypto market data aggregator
  covering 300+ exchanges, 10,000+ assets, and 300,000+ trading pairs. The platform exposes two REST API surfaces — the legacy
  min-api.cryptocompare.com (Price, Historical OHLCV, Top Lists, News, Social, Order Book, Exchanges, Blockchain) and the
  modern data-api.cryptocompare.com / CoinDesk Data API (Spot, Index / Reference Rates including CADLI and CCIX, Asset, News,
  On-Chain, Futures, Options, Overview) — plus a unified WebSocket streamer at wss://streamer.cryptocompare.com/v2 that multiplexes
  Trade, Ticker, CCCAGG aggregate index, Order Book L2 updates and snapshots, Full Volume, Top Tier Full Volume, OHLC Candles,
  and Top of Book channels. Authentication uses an API key supplied as the api_key query parameter or as an `Authorization:
  Apikey {key}` header. Access is metered by monthly call credits with per-second / per-minute / per-hour / per-day ceilings;
  the Free tier issues 100,000 monthly credits and commercial Starter / Professional / Enterprise tiers escalate credit budgets,
  history depth, and surface coverage (news, social, on-chain, derivatives, full streamer, on-demand bulk exports, reference-rate
  licensing).
apis:
- aid: cryptocompare:streamer
  name: CryptoCompare Streaming WebSocket
  tags:
  - Cryptocurrency
  - Streaming
  - WebSocket
  - Order Book
  - OHLCV
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: wss://streamer.cryptocompare.com/v2
  humanURL: https://developers.coindesk.com/documentation/legacy-websockets/HowToConnect
  properties:
  - type: Documentation
    url: https://developers.coindesk.com/documentation/legacy-websockets/HowToConnect
  - type: AsyncAPI
    url: asyncapi/cryptocompare-asyncapi.yml
  description: >-
    Single secure WebSocket endpoint multiplexing every subscription via tilde-delimited subscription strings (e.g. 5~CCCAGG~BTC~USD).
    Channel types: Trade (0), Ticker (2), Aggregate Index / CCCAGG (5), Order Book L2 update (8), Order Book L2 snapshot (9),
    Full Volume (11), Top Tier Full Volume (21), OHLC Candles (24), and Top of Order Book (30). Control envelopes include
    Welcome (20), SubscribeComplete (16), UnsubscribeComplete (17), LoadComplete (3), UnsubscribeAllComplete (18), Heartbeat
    (999), Unauthorized (401), RateLimit (429), and ServerError (500).
  x-features:
  - One socket multiplexes every channel and subscription
  - Wildcards (*) for enterprise bulk subscription
  - Per-account rate-limit telemetry in the Welcome envelope
  - 30-60 second heartbeats with reconnect guidance
  - Streamer (binary) format with bitmask field selection
