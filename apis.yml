  - Risk
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://data.coindesk.com/research/exchange-benchmark
  humanURL: https://data.coindesk.com/research/exchange-benchmark
  properties:
  - type: Documentation
    url: https://data.coindesk.com/research/exchange-benchmark
  description: >-
    Quantitative ranking of integrated exchanges across Legal, KYC and Transaction Risk, Team, Data Provision, Asset Quality
    and Diversity, Market Quality, Security, and Negative Reports Penalty. Grade points and per-criterion splits are surfaced
    on the /exchanges/general endpoint of the min-api.
